name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The GUI links against the platform windowing stack. These are already
      # present on the GitHub runners, but pinning them keeps the build from
      # breaking when the image changes.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libxcb1-dev desktop-file-utils

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace

      # Compares decoded pixels, not file bytes: zlib output differs between
      # versions, so a byte diff would fail on an unrelated toolchain change.
      - name: Icons match their generator
        if: runner.os == 'Linux'
        run: python3 packaging/make_icons.py --check

      # The packaging sources are only exercised by the release workflow, which
      # runs on tags. Without this, a typo in them is discovered during a
      # release instead of during the pull request that introduced it.
      - name: Packaging sources are well formed
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --quiet defusedxml
          python3 - <<'PY'
          import re, sys
          from defusedxml.minidom import parseString

          for path in ("packaging/wix/main.wxs",
                       "packaging/linux/no-watermark.metainfo.xml"):
              src = open(path, encoding="utf-8").read()
              parseString(src.encode("utf-8"))
              # XML forbids a double hyphen inside a comment, and every WiX
              # command line is full of them.
              for comment in re.findall(r"<!--.*?-->", src, re.S):
                  if "--" in comment[4:-3]:
                      sys.exit(f"{path}: double hyphen inside an XML comment")
              print(f"{path}: ok")
          PY
          bash -n packaging/linux/build-deb.sh
          bash -n packaging/linux/build-appimage.sh
          desktop-file-validate packaging/linux/no-watermark.desktop
          echo "packaging sources: ok"
